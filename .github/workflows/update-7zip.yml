# 7-Zip ネイティブバイナリの自動追従 PR bot
#
# 毎週月曜 9:00 JST に公式サイト (7-zip.org) の最新バージョンをチェックし、
# 新バージョンがあれば x64 / arm64 の 7z.dll を更新する PR を自動作成する。
#
# PR はメンテナが内容を確認し merge → /vava で NuGet 公開する運用。
# コンシューマのビルド時にネットワークアクセスは一切発生しない（決定論的ビルド保証）。
name: Update 7-Zip native binaries

on:
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜 00:00 UTC (= 09:00 JST)
  workflow_dispatch:       # 手動実行も可能

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    runs-on: windows-latest
    steps:
      # SHA 固定でサプライチェーン攻撃を防ぐ
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Get current vendored version
        id: current
        shell: pwsh
        run: |
          # Native/x64/7z.dll の FileVersion から現在のベンダードバージョンを取得
          $dll = 'Libraries/Core/Native/x64/7z.dll'
          if (Test-Path $dll) {
            $ver = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $dll)).FileVersion
            "version=$ver" >> $env:GITHUB_OUTPUT
            Write-Host "Current vendored version: $ver"
          } else {
            "version=0.0.0.0" >> $env:GITHUB_OUTPUT
            Write-Host "No vendored dll found"
          }

      - name: Check latest 7-Zip release
        id: latest
        shell: pwsh
        run: |
          # 公式サイトのダウンロードページから最新バージョンを取得
          # (ip7z/7zip GitHub ミラーは公式リリースに対して遅延があるため直接取得)
          $html = (Invoke-WebRequest -Uri 'https://www.7-zip.org/download.html' -UseBasicParsing).Content

          # x64 インストーラのリンクパターンからバージョンを抽出 (例: "a/7z2601-x64.exe")
          $allMatches = [regex]::Matches($html, 'a/7z(\d{2})(\d{2})-x64\.exe')
          if ($allMatches.Count -eq 0) {
            Write-Host "::error::Could not find x64 installer link on 7-zip.org/download.html"
            exit 1
          }

          $best = $allMatches | ForEach-Object {
            [PSCustomObject]@{
              Major = [int]$_.Groups[1].Value
              Minor = [int]$_.Groups[2].Value
              Code  = "$($_.Groups[1].Value)$($_.Groups[2].Value)"
            }
          } | Sort-Object Major, Minor -Descending | Select-Object -First 1

          $tag  = "$($best.Major).$($best.Minor.ToString('D2'))"
          $code = $best.Code
          $base = 'https://www.7-zip.org/a'

          # arm64 インストーラの存在を HEAD リクエストで確認
          $arm64Url = "$base/7z$code-arm64.exe"
          try {
            Invoke-WebRequest -Uri $arm64Url -Method Head -UseBasicParsing -ErrorAction Stop | Out-Null
          } catch {
            Write-Host "::error::arm64 installer not found at $arm64Url ($_)"
            exit 1
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "release_url=https://www.7-zip.org/" >> $env:GITHUB_OUTPUT
          "x64_url=$base/7z$code-x64.exe" >> $env:GITHUB_OUTPUT
          "x64_name=7z$code-x64.exe" >> $env:GITHUB_OUTPUT
          "arm64_url=$arm64Url" >> $env:GITHUB_OUTPUT
          "arm64_name=7z$code-arm64.exe" >> $env:GITHUB_OUTPUT
          Write-Host "Latest release: $tag (x64=7z$code-x64.exe, arm64=7z$code-arm64.exe)"

      - name: Compare versions
        id: compare
        shell: pwsh
        # GitHub Actions の ${{ ... }} 展開は run ブロック内で文字列挿入として動作するため、
        # 外部データ (7-zip.org 由来のバージョン) を env: 経由で渡し、PowerShell 側で $env: で参照する。
        env:
          CURRENT_VER: ${{ steps.current.outputs.version }}
          LATEST_TAG:  ${{ steps.latest.outputs.tag }}
        run: |
          $current = $env:CURRENT_VER
          $tag = $env:LATEST_TAG
          # タグから数字部分を抽出 (例: "26.00" → "26.00")
          $latestNum = $tag -replace '[^0-9.]', ''
          $currentMajor = ($current -split '\.')[0]

          $needsUpdate = $currentMajor -ne $latestNum.Split('.')[0]
          if (-not $needsUpdate) {
            $currentMinor = ($current -split '\.')[1]
            $latestMinor = $latestNum.Split('.')[1]
            $needsUpdate = [int]$latestMinor -gt [int]$currentMinor
          }

          "needs_update=$($needsUpdate.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Current=$current, Latest=$latestNum, NeedsUpdate=$needsUpdate"

      - name: Download and verify
        id: download
        if: steps.compare.outputs.needs_update == 'true'
        shell: pwsh
        # 外部由来のダウンロード URL も env: で渡す (command injection 回避)
        env:
          X64_URL:   ${{ steps.latest.outputs.x64_url }}
          ARM64_URL: ${{ steps.latest.outputs.arm64_url }}
        run: |
          function Test-7zSignature {
            param([string]$Path)
            $sig = Get-AuthenticodeSignature -FilePath $Path
            # Subject は CN を正規表現で厳密一致させ、部分一致バイパスを防ぐ。
            # 例: "CN=Igor Pavlov Malicious LLC" は通らない。
            $subjectOk = $sig.SignerCertificate.Subject -match '(?:^|,\s*)CN=Igor Pavlov(?:,|$)'
            # Issuer も CN= 前提の厳密マッチ (Sectigo / Comodo / DigiCert 系)
            $issuerOk  = ($sig.SignerCertificate.Issuer -match 'CN=[^,]*Sectigo') -or
                         ($sig.SignerCertificate.Issuer -match 'CN=[^,]*Comodo') -or
                         ($sig.SignerCertificate.Issuer -match 'CN=[^,]*DigiCert')
            return ($sig.Status -eq 'Valid' -and $subjectOk -and $issuerOk)
          }

          # ダウンロード + Authenticode 検証
          foreach ($arch in @('x64', 'arm64')) {
            $url = if ($arch -eq 'x64') { $env:X64_URL } else { $env:ARM64_URL }
            $exe = "$env:TEMP\7z-$arch.exe"
            Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing

            if (-not (Test-7zSignature $exe)) {
              Write-Host "::error::Authenticode verification failed for $arch installer"
              exit 1
            }
            Write-Host "$arch installer: Authenticode OK"

            # 7z SFX 内の 7z アーカイブを展開して 7z.dll を取得
            $extractDir = "$env:TEMP\extract-$arch"
            # 7z.exe を使って展開 (GitHub Actions runner には 7-Zip がプリインストール)
            & 7z x $exe -o"$extractDir" -y | Out-Null

            $dll = Get-ChildItem -Path $extractDir -Filter '7z.dll' -Recurse | Select-Object -First 1
            if (-not $dll) {
              Write-Host "::error::7z.dll not found in $arch installer"
              exit 1
            }

            # 展開後の 7z.dll 自体も Authenticode 検証する。
            # インストーラの SFX が侵害されても、内部 DLL の署名までは改竄できない前提で
            # 二重防御とする。
            if (-not (Test-7zSignature $dll.FullName)) {
              Write-Host "::error::Authenticode verification failed for $arch 7z.dll"
              exit 1
            }
            Write-Host "$arch 7z.dll: Authenticode OK"

            Copy-Item $dll.FullName "Libraries/Core/Native/$arch/7z.dll" -Force
            $hash = (Get-FileHash "Libraries/Core/Native/$arch/7z.dll" -Algorithm SHA256).Hash
            Write-Host "$arch 7z.dll updated (SHA256: $hash)"
            "$($arch)_sha256=$hash" >> $env:GITHUB_OUTPUT
          }

      - name: Create Pull Request
        if: steps.compare.outputs.needs_update == 'true'
        # SHA 固定でサプライチェーン攻撃を防ぐ
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/bump-7zip-${{ steps.latest.outputs.tag }}
          title: "chore: 7-Zip ネイティブバイナリを ${{ steps.latest.outputs.tag }} に更新"
          body: |
            ## 更新内容

            7-Zip 本家のネイティブバイナリ (`7z.dll`) を最新版に更新します。

            - **バージョン**: ${{ steps.current.outputs.version }} → ${{ steps.latest.outputs.tag }}
            - **ダウンロード元**: [7-zip.org](${{ steps.latest.outputs.release_url }})
            - **変更履歴**: https://www.7-zip.org/history.txt
            - **x64 installer**: `${{ steps.latest.outputs.x64_name }}`
            - **arm64 installer**: `${{ steps.latest.outputs.arm64_name }}`

            Authenticode 署名検証 (Igor Pavlov 名義 / 認可 CA チェーン) 済み。
            インストーラ .exe に加えて、展開後の `7z.dll` 自体も二重で署名検証している。

            ## バイナリハッシュ
            - `x64/7z.dll` SHA256: `${{ steps.download.outputs.x64_sha256 }}`
            - `arm64/7z.dll` SHA256: `${{ steps.download.outputs.arm64_sha256 }}`

            ---
            このPRは `.github/workflows/update-7zip.yml` により自動作成されました。
          labels: dependencies
          commit-message: "chore: 7-Zip ネイティブバイナリを ${{ steps.latest.outputs.tag }} に更新"
