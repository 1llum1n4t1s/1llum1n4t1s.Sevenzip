# NuGet パッケージ公開ワークフロー
#
# release/** ブランチへの push 時に、7-zip.org から最新の 7z.dll を取得し、
# ビルド → パック → NuGet 公開を行う。
name: Publish to NuGet

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

# 最小権限: NuGet 公開に必要な GITHUB_TOKEN アクセスは無く、
# secrets.NUGET_API_KEY のみで公開する。リポジトリ書き込み権限は不要。
permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    # workflow_dispatch からの誤実行防止: release/** ブランチ以外では実行しない
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/release/'))
    steps:
      - name: Checkout code
        # SHA 固定でサプライチェーン攻撃を防ぐ
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Fetch latest 7-Zip native binaries
        shell: pwsh
        run: |
          # 7-zip.org のダウンロードページから最新バージョンを検出。
          # 最新版は GitHub (ip7z/7zip) にホスト、旧版は 7-zip.org/a/ に置かれるため
          # 両パターンの href を統一的にマッチさせる。
          $html = (Invoke-WebRequest -Uri 'https://www.7-zip.org/download.html' -UseBasicParsing).Content
          $pattern = 'href="([^"]*7z(\d{2})(\d{2})-x64\.exe)"'
          $allMatches = [regex]::Matches($html, $pattern)
          if ($allMatches.Count -eq 0) {
            Write-Host "::error::Could not find x64 installer link on 7-zip.org/download.html"
            exit 1
          }

          # 配信元ホストの allowlist。最新版は GitHub (ip7z/7zip)、旧版は 7-zip.org に置かれる。
          # ダウンロードページはスクレイプ対象なので、href が任意の絶対 URL を指していても
          # 素通しせず、既知の配信元だけを許可する。
          $allowedHosts = @('www.7-zip.org', '7-zip.org', 'github.com', 'objects.githubusercontent.com')

          $best = $allMatches | ForEach-Object {
            $href = $_.Groups[1].Value
            if (-not $href.StartsWith('http')) { $href = "https://www.7-zip.org/$href" }
            [PSCustomObject]@{
              Major = [int]$_.Groups[2].Value
              Minor = [int]$_.Groups[3].Value
              Code  = "$($_.Groups[2].Value)$($_.Groups[3].Value)"
              Url   = $href
            }
          } | Sort-Object Major, Minor -Descending | Select-Object -First 1

          $tag  = "$($best.Major).$($best.Minor.ToString('D2'))"
          $code = $best.Code
          $x64Url   = $best.Url
          $arm64Url = $x64Url -replace '-x64\.exe$', '-arm64.exe'
          Write-Host "Latest 7-Zip: $tag"

          # 配信元ホストを検証する。HTTPS 以外と allowlist 外は拒否する。
          function Assert-AllowedUrl {
            param([string]$Url)
            $u = [uri]$Url
            if ($u.Scheme -ne 'https') {
              Write-Host "::error::Refusing non-HTTPS download URL: $Url"
              exit 1
            }
            if ($allowedHosts -notcontains $u.Host) {
              Write-Host "::error::Refusing download from unexpected host '$($u.Host)': $Url"
              exit 1
            }
          }

          Assert-AllowedUrl $x64Url
          Assert-AllowedUrl $arm64Url

          # 同梱した 7z.dll を job summary に記録するためのヘッダ
          @(
            "### Bundled 7-Zip native binaries",
            "",
            "Detected latest: **$tag**",
            "",
            "| arch | FileVersion | SHA256 |",
            "| --- | --- | --- |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          # Authenticode 検証関数。
          #
          # 重要: 本家 7-Zip は配布バイナリに Authenticode 署名を付けていない
          # (26.02 の GitHub リリース installer と同梱 7z.dll はいずれも NotSigned を実測確認)。
          # したがって「未署名なら失敗」にすると全てのリリースが不可能になる。
          # 署名が付いている版では厳密に検証し、無い版は警告のうえ続行する。
          # 未署名版に対する改ざん対策は、この関数ではなく HTTPS + 配信元ホスト allowlist
          # (Assert-AllowedUrl) と、同梱バイナリの SHA256 を job summary へ記録して
          # 事後追跡できるようにすることで担保している。
          function Test-7zSignature {
            param([string]$Path)
            $sig = Get-AuthenticodeSignature -FilePath $Path
            if ($sig.Status -eq 'NotSigned') {
              Write-Host "::warning::$Path is not Authenticode-signed (upstream 7-Zip does not sign its binaries). Provenance relies on the HTTPS host allowlist."
              return $true
            }
            $subjectOk = $sig.SignerCertificate.Subject -match '(?:^|,\s*)CN=Igor Pavlov(?:,|$)'
            $issuerOk  = ($sig.SignerCertificate.Issuer -match 'CN=[^,]*Sectigo') -or
                         ($sig.SignerCertificate.Issuer -match 'CN=[^,]*Comodo') -or
                         ($sig.SignerCertificate.Issuer -match 'CN=[^,]*DigiCert')
            if (-not ($sig.Status -eq 'Valid' -and $subjectOk -and $issuerOk)) {
              Write-Host "::error::Authenticode verification FAILED — Subject: $($sig.SignerCertificate.Subject)"
              return $false
            }
            Write-Host "$Path : Authenticode OK (Igor Pavlov)"
            return $true
          }

          foreach ($arch in @('x64', 'arm64')) {
            $url = if ($arch -eq 'x64') { $x64Url } else { $arm64Url }
            $exe = "$env:TEMP\7z-$arch.exe"
            Write-Host "Downloading $arch from $url"
            Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing

            if (-not (Test-7zSignature $exe)) { exit 1 }

            $extractDir = "$env:TEMP\extract-$arch"
            # 終了コードを検査する。展開失敗を握り潰すと後段の「7z.dll not found」に縮退して
            # 実際の原因 (インストーラ形式変更等) に到達できない。
            $extractLog = & 7z x $exe -o"$extractDir" -y 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::Failed to extract $arch installer (7z exit code $LASTEXITCODE)"
              $extractLog | ForEach-Object { Write-Host $_ }
              exit 1
            }

            $dll = Get-ChildItem -Path $extractDir -Filter '7z.dll' -Recurse | Select-Object -First 1
            if (-not $dll) {
              Write-Host "::error::7z.dll not found in $arch installer"
              exit 1
            }

            if (-not (Test-7zSignature $dll.FullName)) { exit 1 }

            Copy-Item $dll.FullName "Libraries/Core/Native/$arch/7z.dll" -Force
            $ver  = [System.Diagnostics.FileVersionInfo]::GetVersionInfo("Libraries/Core/Native/$arch/7z.dll").FileVersion
            $hash = (Get-FileHash "Libraries/Core/Native/$arch/7z.dll" -Algorithm SHA256).Hash
            Write-Host "$arch 7z.dll updated to $ver (SHA256: $hash)"

            # 同梱物を job summary へ残す。CI ログは保持期間で消えるため、後から
            # 「どの 7z.dll が入ったパッケージか」を切り分けられるようにする。
            "| $arch | $ver | ``$hash`` |" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        # --locked-mode で packages.lock.json との不一致を公開前に失敗させる。
        # これが無いと restore がロックファイルを黙って書き換えて成功し、
        # 「lock file で依存を固定する」という前提がゲートとして機能しない。
        run: dotnet restore Cube.FileSystem.SevenZip.slnx --locked-mode

      - name: Build Release
        run: dotnet build Cube.FileSystem.SevenZip.slnx -c Release -p:Platform=AnyCPU --no-restore

      # 取得したばかりの 7z.dll に対してテストを実行する。これが無いと、
      # 7-Zip 側の挙動変化 (実績: 25.01 → 26.00 の SJIS 自動検出削除など) が
      # 一度もテストされないまま NuGet へ公開され、消費者側で初めて発覚する。
      #
      # runner のロケールは ja-JP ではないため、UTF-8 フラグ (bit11) の立っていない
      # 非 ASCII 名を含むアーカイブを扱うテストは ArchiveOption.CodePage を明示指定して
      # ホストの非 Unicode プログラム用コードページに依存しないようにしてある
      # (ArchiveReaderTest.TestCases のコメントと
      #  Items_ExplicitCodePage_OverridesHostCodePage を参照)。
      - name: Test
        run: dotnet test Tests/Core/Cube.FileSystem.SevenZip.Tests.csproj -c Release -p:Platform=AnyCPU --no-restore

      - name: Pack
        run: dotnet pack Libraries/Core/Cube.FileSystem.SevenZip.csproj -c Release -p:Platform=AnyCPU --no-build -o Libraries/Core/bin -p:NoDefaultExcludes=true

      - name: Publish to NuGet
        run: |
          $apiKey = $env:NUGET_API_KEY
          .\publish.ps1
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: pwsh
