name: Dependency validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # SDK は publish.yml と同じ版に完全固定する。浮動 (11.0.x) だと新しい SDK の公開時に
          # 暗黙参照の Microsoft.NET.ILLink.Tasks の版が変わり、packages.lock.json と食い違って
          # --locked-mode restore が失敗する。SDK を上げるときは両 workflow と lock を同時に更新する。
          dotnet-version: 11.0.100
      - name: Restore
        run: |
          dotnet restore Cube.FileSystem.SevenZip.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: |
          dotnet build Cube.FileSystem.SevenZip.slnx -c Release --no-restore -p:Platform=AnyCPU
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run existing regression tests
        run: |
          dotnet test Tests/Core/Cube.FileSystem.SevenZip.Tests.csproj -c Release -p:Platform=AnyCPU --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
